services:
  - type: web
    name: trusthire-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: trusthire-db
          property: connectionString

databases:
  - name: trusthire-db
    plan: free
    databaseName: trusthire
    user: trusthire_user
