server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: trusthire-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/trusthiredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://*.onrender.com,https://*.netlify.app}

gemini:
  api-key: ${GEMINI_API_KEY:}

