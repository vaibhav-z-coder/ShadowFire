server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: trusthire-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://*.onrender.com,https://*.netlify.app}
